# Apply AFTER the SSO-capable pository release is deployed and server-setup.sh has run.
# Replaces the dashboard `location /` block in /etc/nginx/sites-available/pository.ttswebui.com
# and adds /sso/api/v1/. Keep the existing open API location (CI uploads, apt, OIDC, API keys).
#
# Also add inside the 443 server block:
#   include /etc/nginx/snippets/authelia-location.conf;     # internal Authelia authz endpoint

# Dashboard: protected by Authelia
location / {
    include /etc/nginx/snippets/authelia-authrequest-root.conf;
    proxy_pass http://127.0.0.1:3223;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_cache_bypass $http_upgrade;
}

# Browser API calls: Authelia cookie -> backend, with the shared secret and Remote-* headers.
location /sso/api/v1/ {
    include /etc/nginx/snippets/authelia-authrequest-root.conf;
    include /etc/nginx/snippets/pository-sso-secret.conf;
    rewrite ^/sso/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3222;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
