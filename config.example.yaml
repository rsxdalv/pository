# Pository Configuration File
# Place at /etc/pository/config.yaml or specify via POSITORY_CONFIG env var

# Data storage root directory
dataRoot: /var/lib/pository

# Log file directory
logPath: /var/log/pository

# Server settings
port: 3000
bindAddress: 0.0.0.0

# TLS configuration (optional)
tls:
  enabled: false
  # cert: /etc/pository/server.crt
  # key: /etc/pository/server.key

# Upload size limit (in bytes)
maxUploadSize: 104857600  # 100MB

# Allowed repository names (empty means all allowed)
allowedRepos:
  - default
  - releases
  - snapshots

# Path to API keys storage
apiKeysPath: /etc/pository/api-keys.json

# Bootstrap admin key (can also be set via POSITORY_ADMIN_KEY env var)
# WARNING: Change this in production!
# adminKey: your-secret-admin-key

# CORS allowed origins for the web dashboard
# Comma-separated list; if empty, only localhost / 127.0.0.1 origins are allowed.
# Set to the public URL of your pository-frontend instance in production.
# Can also be set via POSITORY_CORS_ORIGINS env var (comma-separated).
# corsOrigins:
#   - https://pository.example.com

# Retention policy (optional)
retention:
  enabled: false
  # keepLastN: 5
  # maxAgeDays: 90

# GitHub OIDC authentication (optional — zero config for the common case)
#
# Allows GitHub Actions workflows to upload packages without a static API key.
# The workflow must have `id-token: write` permission.
#
# Default rule: any private repository under oidcAllowedOwners can upload a
# package whose name matches the GitHub repository name (convention over config).
# Example: repo "rsxdalv/my-service" → can upload package "my-service".
#
# Override examples:
#   oidcOverrides:
#     rsxdalv/mono-repo:      # one repo, multiple package names
#       - service-a
#       - service-b
#     rsxdalv/deployment-bot: # wildcard — can upload anything
#       - '*'
#
# oidcAudience: pository                  # must match the action's oidc-audience input
# oidcAllowedOwners:                      # GitHub owners allowed by the default rule
#   - rsxdalv
# oidcRequirePrivate: true                # set to false to allow public repos via default rule
# oidcOverrides: {}                       # per-repo package allowlists
#
# Multi-flavor (production / staging / testing) naming support:
# oidcAllowedSuffixes lets a single GitHub repo upload multiple package flavors
# by default rule without needing an explicit oidcOverride entry.
# Example: repo "rsxdalv/my-service" → can upload my-service, my-service-staging, my-service-testing
#
# oidcAllowedSuffixes:                    # default: [""] (exact match only)
#   - ''                                  # production:  my-service
#   - '-staging'                          # staging:     my-service-staging
#   - '-testing'                          # testing:     my-service-testing

# Authelia SSO via nginx forward-auth (dashboard login without an API key).
# nginx must add `X-Pository-Sso-Secret: <ssoSecret>` plus Remote-User / Remote-Groups
# ONLY on the Authelia-protected /sso/ location. Requests without the matching secret are
# never treated as SSO, so the open /api/v1 location (CI, apt, OIDC) is unaffected.
# Env: POSITORY_SSO_SECRET, POSITORY_SSO_ADMIN_GROUPS, POSITORY_SSO_WRITE_GROUPS
#
# ssoSecret: <long-random-string>
# ssoAdminGroups: [admins]                # Authelia groups -> admin role
# ssoWriteGroups: []                      # Authelia groups -> write role
# ssoDefaultRole: read                    # read | write | admin | none for other authenticated users

# Reverse proxies whose X-Forwarded-For is trusted (env POSITORY_TRUST_PROXY: true|false|comma list)
# trustProxy: "127.0.0.1,::1"

# Requests per minute per identity (API key / SSO user / OIDC repo, else client IP).
# /healthz, /readyz, /metrics and /apt/* are exempt. (env POSITORY_RATE_LIMIT_MAX)
# rateLimitMax: 300

# Retention: after each upload, prune older versions of the same package
# (per repo/distribution/component/architecture/name, Debian version order).
# With both set, a version is removed only if it is beyond keepLastN AND older than maxAgeDays.
# retention:
#   enabled: false
#   keepLastN: 5
#   maxAgeDays: 90

# Re-uploading an existing version with DIFFERENT content (identical bytes are always a no-op 200):
#   allow          - always replace (pre-0.6 behaviour)
#   default-branch - (default) GitHub OIDC uploads may replace only from overwriteAllowedRefs;
#                    builds from PRs, feature branches and tags get 409. API-key uploads may replace.
#   reject         - published versions are immutable; changed re-uploads always get 409
# (env POSITORY_OVERWRITE_POLICY)
# overwritePolicy: default-branch
# overwriteAllowedRefs:
#   - refs/heads/main
#   - refs/heads/master
